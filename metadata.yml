Title: Penetration in gram-negative bacteria
Description: Estimates the likelihood that a compound accumulates inside Gram-negative bacteria, the barrier that keeps most antibacterial chemistry from reaching its target. Richter and colleagues measured accumulation in Escherichia coli for over 180 diverse compounds and found the determinants differed from the polarity and weight heuristics inherited from retrospective studies. Their dataset underpins this classifier. Accumulation was measured in E. coli, so extrapolation to other Gram-negative species is not established.
